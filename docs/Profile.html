  <!-- ZERO-FLICKER: wait for firebase auth and reveal navbar only after onAuthStateChanged -->
  <script>
  (function(){
    const container = document.getElementById('accountContainer');
    if (!container) return;

    function genInitialsDataUrl(name, size=128){
      const initials = (name||'').trim().split(' ').map(s=>s.charAt(0)).filter(Boolean).slice(0,2).join('').toUpperCase() || 'U';
      try{
        const c=document.createElement('canvas'); c.width=c.height=size;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#e6e9ef'; ctx.fillRect(0,0,size,size);
        ctx.fillStyle='#111827'; ctx.font = Math.floor(size*0.45)+'px sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(initials,size/2,size/2 + size*0.03);
        return c.toDataURL();
      }catch(e){ return ''; }
    }

    function applyUserToDom(user){
      const loginLink = document.getElementById('loginLink');
      const userPanel = document.getElementById('userPanel');
      const avatar = document.getElementById('userAvatar');
      const menuAvatar = document.querySelector('.user-menu-avatar');
      const bigAvatar = document.getElementById('bigAvatar');
      const userName = document.getElementById('userName');
      const bigName = document.getElementById('bigName');
      const bigEmail = document.getElementById('bigEmail');
      const menuName = document.getElementById('menuName');
      const menuEmail = document.getElementById('menuEmail');
      const providerList = document.getElementById('providerList');
      const createdAt = document.getElementById('createdAt');

      if (!user) {
        if (loginLink) loginLink.style.display = 'flex';
        if (userPanel) userPanel.style.display = 'none';
        if (bigName) bigName.textContent = 'Guest';
        if (bigEmail) bigEmail.textContent = '';
        return;
      }

      if (loginLink) loginLink.style.display = 'none';
      if (userPanel) userPanel.style.display = 'flex';

      const name = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
      const email = user.email || '';
      const photo = user.photoURL || '';
      const fallback = genInitialsDataUrl(name);
      const finalSrc = photo || fallback;

      if (avatar) avatar.src = finalSrc;
      if (menuAvatar) menuAvatar.src = finalSrc;
      if (bigAvatar) bigAvatar.src = finalSrc;
      if (userName) userName.textContent = name;
      if (bigName) bigName.textContent = name;
      if (bigEmail) bigEmail.textContent = email;
      if (menuName) menuName.textContent = name;
      if (menuEmail) menuEmail.textContent = email;

      try {
        const provs = (user.providerData || []).map(p=>p.providerId).join(', ') || 'email/password';
        if (providerList) providerList.textContent = 'Signed in with: ' + provs;
      } catch(e){}

      try {
        const meta = user.metadata || {};
        if (meta && meta.creationTime && createdAt) createdAt.textContent = 'Member since: ' + (new Date(meta.creationTime)).toLocaleDateString();
      } catch(e){}
    }

    function revealAndApply(reason){
      if (container.classList.contains('hide-until-auth')) container.classList.remove('hide-until-auth');
      try {
        Object.defineProperty(container.style, 'visibility', { configurable:false, writable:false, value: getComputedStyle(container).visibility || ''});
      } catch(e){}
      console.log('[auth-reveal] revealed, reason=',reason);
    }

    function attachAuthListener(){
      if (!window.firebase || !firebase.auth) return false;
      const unsub = firebase.auth().onAuthStateChanged(user=>{
        applyUserToDom(user);
        revealAndApply('onAuthStateChanged');
        try{ if (typeof unsub === 'function') unsub(); } catch(e){}
      }, err=>{
        console.warn('onAuthStateChanged error', err);
        revealAndApply('error');
        try{ if (typeof unsub === 'function') unsub(); } catch(e){}
      });
      return true;
    }

    if (!attachAuthListener()) {
      let tries=0;
      const iv = setInterval(()=>{
        if (attachAuthListener()){ clearInterval(iv); return; }
        if (++tries > 40){ clearInterval(iv); console.warn('[auth-reveal] firebase not available — revealing anyway'); revealAndApply('timeout'); }
      }, 50);
    }

    setTimeout(()=> {
      if (container.classList.contains('hide-until-auth')) {
        revealAndApply('safety-timeout');
      }
    }, 1500);
  })();
  </script>

  <!-- Account/dropdown behavior + profile save (displayName only) -->
  <script>
  (function(){
    const userToggle = document.getElementById('userToggle');
    const userMenu = document.getElementById('userMenu');
    const userPanel = document.getElementById('userPanel');
    if (userToggle && userMenu && userPanel) {
      function openMenu(){ userMenu.classList.add('open'); userMenu.setAttribute('aria-hidden','false'); userToggle.setAttribute('aria-expanded','true'); const first = userMenu.querySelector('a,button'); if(first) first.focus(); }
      function closeMenu(){ userMenu.classList.remove('open'); userMenu.setAttribute('aria-hidden','true'); userToggle.setAttribute('aria-expanded','false'); try{ userToggle.focus(); }catch(e){} }

      const captureGuard = (ev)=>{ if (userPanel.contains(ev.target)) ev.stopImmediatePropagation(); };
      document.addEventListener('pointerdown', captureGuard, true);
      document.addEventListener('click', captureGuard, true);

      userToggle.addEventListener('pointerup', (ev)=>{ ev.preventDefault(); ev.stopPropagation(); if (userMenu.classList.contains('open')) closeMenu(); else openMenu(); }, {passive:false});
      userToggle.addEventListener('click', (ev)=>{ ev.preventDefault(); ev.stopPropagation(); if (userMenu.classList.contains('open')) closeMenu(); else openMenu(); }, {passive:false});

      document.addEventListener('pointerdown', (ev)=>{ if (userPanel.contains(ev.target)) return; if (userMenu.classList.contains('open')) closeMenu(); }, {passive:true});
    }

    // Sign out handling
    async function signoutHandler(){
      try {
        await firebase.auth().signOut();
        window.location.replace('index.html');
      } catch(e){ console.error('Sign out failed', e); alert('Sign out failed: ' + (e && e.message)); }
    }
    const menuSignOut = document.getElementById('menuSignOut');
    if (menuSignOut) menuSignOut.addEventListener('click', signoutHandler);
    const signoutInline = document.getElementById('signoutInline');
    if (signoutInline) signoutInline.addEventListener('click', signoutHandler);
    const inlineAlt = document.querySelector('.profile-card .signout');
    if (inlineAlt) inlineAlt.addEventListener('click', signoutHandler);

    // populate input from currentUser
    function populateEditFields(){
      try {
        const u = firebase.auth().currentUser;
        if (!u) return;
        document.getElementById('displayName').value = u.displayName || '';
      } catch(e){}
    }

    // apply updated displayName/avatar to DOM
    function applyUpdatedProfileToDOM(user){
      if (!user) return;
      const name = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
      const photo = user.photoURL || '';
      // generate fallback initials if needed
      function genInitialsDataUrl(name, size=128){
        const initials = (name||'').trim().split(' ').map(s=>s.charAt(0)).filter(Boolean).slice(0,2).join('').toUpperCase() || 'U';
        try{
          const c=document.createElement('canvas'); c.width=c.height=size;
          const ctx=c.getContext('2d');
          ctx.fillStyle='#e6e9ef'; ctx.fillRect(0,0,size,size);
          ctx.fillStyle='#111827'; ctx.font = Math.floor(size*0.45)+'px sans-serif';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(initials,size/2,size/2 + size*0.03);
          return c.toDataURL();
        }catch(e){ return ''; }
      }
      const fallback = genInitialsDataUrl(name);
      const final = photo || fallback;

      try{ document.getElementById('bigAvatar').src = final; }catch(e){}
      try{ document.getElementById('userAvatar').src = final; }catch(e){}
      try{ document.querySelector('.user-menu-avatar').src = final; }catch(e){}
      try{ document.getElementById('bigName').textContent = name; }catch(e){}
      try{ document.getElementById('userName').textContent = name; }catch(e){}
      try{ document.getElementById('menuName').textContent = name; }catch(e){}
    }

    // Edit button: scroll + focus
    const editBtn = document.getElementById('editProfile');
    if (editBtn) editBtn.addEventListener('click', (ev)=>{
      ev.preventDefault();
      const formCard = document.getElementById('profileFormCard');
      if (formCard) {
        formCard.scrollIntoView({behavior:'smooth', block:'center'});
        setTimeout(()=> { const input = document.getElementById('displayName'); input.focus(); input.select(); }, 320);
      }
    });

    // Save handler (displayName only)
    document.getElementById('saveProfile').addEventListener('click', async (ev)=>{
      ev.preventDefault();
      const msg = document.getElementById('profileMsg');
      msg.textContent = ''; msg.style.color = 'var(--muted)';
      try {
        const user = firebase.auth().currentUser;
        if (!user) throw new Error('Not signed in');
        const name = document.getElementById('displayName').value.trim();
        if (!name) { msg.style.color = '#ffbaba'; msg.textContent = 'Please provide a display name.'; document.getElementById('displayName').focus(); return; }

        // only update displayName (photo editing intentionally disabled)
        if (name !== (user.displayName || '')) {
          await user.updateProfile({ displayName: name });
        }

        // refresh local user object (compat updates currentUser)
        const refreshed = firebase.auth().currentUser;
        applyUpdatedProfileToDOM(refreshed);

        msg.style.color = '#b7f5c6';
        msg.textContent = 'Profile updated successfully.';
      } catch (e) {
        console.error('Update failed', e);
        if (e && e.code === 'auth/requires-recent-login') {
          document.getElementById('profileMsg').style.color = '#ffbaba';
          document.getElementById('profileMsg').textContent = 'Update failed: please re-login and try again.';
        } else {
          document.getElementById('profileMsg').style.color = '#ffbaba';
          document.getElementById('profileMsg').textContent = 'Update failed: ' + (e && e.message ? e.message : 'unknown error');
        }
      }
    });

    // hook populate once auth ready
    try {
      if (window.firebase && firebase.auth) {
        if (firebase.auth().currentUser) populateEditFields();
        firebase.auth().onAuthStateChanged(u=> { if (u) populateEditFields(); });
      } else {
        // retry a few times if firebase not ready yet
        let t = 0;
        const iv = setInterval(()=>{
          if (window.firebase && firebase.auth) {
            clearInterval(iv);
            if (firebase.auth().currentUser) populateEditFields();
            firebase.auth().onAuthStateChanged(u=> { if (u) populateEditFields(); });
          }
          if (++t > 40) clearInterval(iv);
        }, 50);
      }
    } catch(e){ console.warn(e); }

  })();
  </script>
