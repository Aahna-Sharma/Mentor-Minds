<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mentor-Minds — Login</title>
  <link rel ="stylesheet" href="Loginpage.css" />
  
</head>

<body>
  <div class="card" role="main" aria-labelledby="loginTitle">
    <h1 id="loginTitle">Sign in to Mentor-Minds</h1>
    <p class="sub">Use Google, GitHub, or email to sign in.</p>

    <div class="field">
      <input id="email" type="email" placeholder="Email" autocomplete="email">
    </div>
    <div class="field">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
       <div class="field" style="display:flex; gap:8px; margin-top:12px">
      <button id="emailSignIn" class="btn">Sign in with email</button>
      <button id="emailSignUp" class="btn" type="button">Create account</button>
    </div>


    <div class="oauth-row">
      <button id="googleBtn" class="oauth-btn" aria-label="Sign in with Google">Sign in with Google</button>
      <button id="githubBtn" class="oauth-btn" aria-label="Sign in with GitHub">Sign in with GitHub</button>
    </div>

    <div style="margin-top:10px" class="small">Don't have an account? <a href="#" id="createAccount">Create one</a>
    </div>

    <div id="err" class="error"></div>
  </div>

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="auth.js"></script>

  <script>
    // ---------- INSERT YOUR FIREBASE CONFIG BELOW ----------
    const firebaseConfig = {
        apiKey: "AIzaSyAYjBkpsYgljPkNaDEbr8cwkzVvNMzLfDc",
        authDomain: "the-mentor-minds-46f88.firebaseapp.com",
        projectId: "the-mentor-minds-46f88",
        storageBucket: "the-mentor-minds-46f88.firebasestorage.app",
        messagingSenderId: "19125411333",
        appId: "1:19125411333:web:a3e274b5830d6cad07466c",
        measurementId: "G-QKNJFEY8X4"
      };
    // -------------------------------------------------------

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // If using GitHub provider, make sure your OAuth redirect URL(s) in Firebase Console exactly match
    // window.location.origin or the deployed origin.
    // Example: https://yourdomain.com/  (no trailing path unless you added it in console)

    const googleProvider = new firebase.auth.GoogleAuthProvider();
    const githubProvider = new firebase.auth.GithubAuthProvider();

    // Accessibility: show user errors in #err
    const errEl = document.getElementById('err');
    function showError(msg) {
      errEl.style.display = 'block';
      errEl.textContent = msg;
    }
    function clearError() {
      errEl.style.display = 'none';
      errEl.textContent = '';
    }

    // email sign in / create
    document.getElementById('emailSignIn').addEventListener('click', async () => {
      clearError();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      if (!email || !pass) return showError('Please enter email and password.');

      try {
        // Try to sign in; if user doesn't exist, create account
        await auth.signInWithEmailAndPassword(email, pass);
        // onAuthStateChanged will redirect to index.html after login
      } catch (err) {
        // If user not found, attempt create
        if (err.code === 'auth/user-not-found') {
          try {
            await auth.createUserWithEmailAndPassword(email, pass);
          } catch (err2) {
            showError(err2.message || 'Could not create account.');
          }
        } else {
          showError(err.message || 'Authentication failed.');
        }
      }
    });

    // Try popup sign-in; if popup blocked or fails, fallback to redirect flow.
    async function signInWithProvider(provider) {
      clearError();
      try {
        await auth.signInWithPopup(provider);
        // success -> onAuthStateChanged runs and redirects
      } catch (popupError) {
        // Popup blocked or other popup errors — fallback to redirect
        console.warn('Popup sign-in failed, trying redirect:', popupError && popupError.message);
        try {
          await auth.signInWithRedirect(provider);
          // After redirect, user returns and onAuthStateChanged will run
        } catch (redirectErr) {
          showError(redirectErr.message || 'Sign-in failed.');
        }
      }
    }

    document.getElementById('googleBtn').addEventListener('click', () => signInWithProvider(googleProvider));
    document.getElementById('githubBtn').addEventListener('click', () => signInWithProvider(githubProvider));

    // Create account link: focus email field for convenience
   // Create account button (explicit)
document.getElementById('emailSignUp').addEventListener('click', async () => {
  clearError();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;

  if (!email || !pass) return showError('Please enter an email and password to create an account.');
  if (pass.length < 6) return showError('Password must be at least 6 characters.');

  try {
    // Create the account
    const result = await auth.createUserWithEmailAndPassword(email, pass);
    // Optionally set displayName here if you collect a name
    // await result.user.updateProfile({ displayName: 'User Name' });

    // Account created — onAuthStateChanged will run. Show a quick success then redirect:
    // (You may skip showing success and just redirect)
    window.location.replace('index.html');
  } catch (err) {
    // Friendly messages for common errors
    if (err && err.code) {
      switch (err.code) {
        case 'auth/email-already-in-use':
          showError('An account already exists with that email. Try signing in.');
          break;
        case 'auth/invalid-email':
          showError('Please enter a valid email address.');
          break;
        case 'auth/weak-password':
          showError('Password is too weak. Use at least 6 characters.');
          break;
        default:
          showError(err.message || 'Account creation failed.');
      }
    } else {
      showError(err.message || 'Account creation failed.');
    }
  }
});

    // Important: onAuthStateChanged ensures stable redirect AFTER firebase finishes restoring user.
    auth.onAuthStateChanged((user) => {
      if (user) {
        // user signed in — ensure profile is loaded consistently
        // Optional: you may want to save user displayName/photoURL to your DB here.
        // Redirect to main page:
        // NOTE: change 'index.html' to your desired post-login page.
        window.location.replace('index.html');
      } else {
        // not signed in — stay on login page; nothing to do
      }
    });

    // When returning from redirect sign-in, call getRedirectResult to surface errors if needed.
    (async function handleRedirectResult() {
      try {
        const result = await auth.getRedirectResult();
        // If result.user exists, onAuthStateChanged already handles redirect.
        if (result && result.user) {
          // optionally handle result.credential.accessToken for GitHub/Google
        }
      } catch (e) {
        // show redirect sign-in errors (e.g. redirect_uri mismatch shows here)
        // Mismatch errors mean you must update the Authorized domains / redirect URI in Firebase console.
        if (e && e.message) {
          console.warn('Redirect result error:', e.message);
          // show to user but keep it friendly:
          showError(e.message);
        }
      }
    })();
  </script>
</body>

</html>
