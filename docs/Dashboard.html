<script>
(function(){
  // small safety fallback — if Firebase currentUser already exists, force navbar update
  function applyUserToNavbar(u) {
    if (!u) return;
    const loginLink = document.getElementById('loginLink');
    const userPanel = document.getElementById('userPanel');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    if (loginLink) loginLink.style.display = 'none';
    if (userPanel) userPanel.style.display = 'flex';
    if (userAvatar) userAvatar.src = u.photoURL || '';
    if (userName) userName.textContent = u.displayName || u.email || 'User';
  }

  try {
    if (window.firebase && firebase.auth && firebase.auth().currentUser) {
      applyUserToNavbar(firebase.auth().currentUser);
    } else {
      setTimeout(() => { 
        if (window.firebase && firebase.auth && firebase.auth().currentUser)
            applyUserToNavbar(firebase.auth().currentUser);
      }, 500);
    }
  } catch(e){ console.warn('safety navbar update failed', e); }
})();
</script>
<script>
(function(){
  // Runs AFTER DOM and AFTER firebase + mentorAuth exist
  function waitForFirebaseReady(fn){
    const iv = setInterval(()=>{
      if (window.firebase && firebase.auth && window.mentorAuth && mentorAuth.auth){
        clearInterval(iv);
        fn();
      }
    }, 50);
  }

  waitForFirebaseReady(()=>{
    console.log("[Navbar] Firebase ready");

    firebase.auth().onAuthStateChanged((user)=>{
      console.log("[Navbar] onAuthStateChanged ->", user && user.email);

      const loginLink = document.getElementById("loginLink");
      const userPanel  = document.getElementById("userPanel");
      const avatar     = document.getElementById("userAvatar");
      const userName   = document.getElementById("userName");
      const menuName   = document.getElementById("menuName");
      const menuEmail  = document.getElementById("menuEmail");

      if (!user) {
        if (loginLink)  loginLink.style.display = "flex";
        if (userPanel)  userPanel.style.display = "none";
        return;
      }

      // USER IS LOGGED IN → show dropdown
      if (loginLink) loginLink.style.display = "none";
      if (userPanel) userPanel.style.display = "flex";

      const name = user.displayName || (user.email ? user.email.split("@")[0] : "User");
      const email = user.email || "";
      const photo = user.photoURL || "";

      if (avatar) avatar.src = photo;
      if (userName) userName.textContent = name;
      if (menuName) menuName.textContent = name;
      if (menuEmail) menuEmail.textContent = email;

      // open menu only if you want:
      // document.getElementById("userMenu").classList.add("open");
    });
  });
})();
</script>

<script>
(function(){
  const KEY = 'mm-simple-list';
  const input = document.getElementById('newItem');
  const addBtn = document.getElementById('addBtn');
  const listEl = document.getElementById('list');
  const totalEl = document.getElementById('total');
  const doneEl = document.getElementById('done');
  const pctEl = document.getElementById('percent');
  const clearAllBtn = document.getElementById('clearAll');
  const clearDoneBtn = document.getElementById('clearDone');

  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; } }
  function save(items){ localStorage.setItem(KEY, JSON.stringify(items)); }

  let items = load();

  function render(){
    listEl.innerHTML = '';
    let total = items.length;
    let done = 0;
    items.forEach((it, idx) => {
      if (it.done) done++;
      const li = document.createElement('li');
      li.className = 'item' + (it.done ? ' done' : '');
      li.innerHTML = `
        <button class="toggle" data-i="${idx}" aria-label="toggle">&#10003;</button>
        <span class="title">${escapeHtml(it.text)}</span>
        <button class="remove" data-i="${idx}" aria-label="remove">✕</button>
      `;
      listEl.appendChild(li);
    });
    totalEl.textContent = total;
    doneEl.textContent = done;
    pctEl.textContent = total ? Math.round((done/total)*100) + '%' : '0%';
  }

  function escapeHtml(s){ return (s+'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  addBtn.addEventListener('click', ()=>{
    const v = input.value.trim();
    if (!v) return;
    items.unshift({ text: v, done: false, id: Date.now() });
    save(items);
    input.value = '';
    render();
  });

  input.addEventListener('keydown', e=> { if (e.key === 'Enter') addBtn.click(); });

  listEl.addEventListener('click', (e)=>{
    const t = e.target;
    const idx = t.getAttribute && t.getAttribute('data-i');
    if (t.classList.contains('toggle') && idx !== null){
      items[idx].done = !items[idx].done;
      save(items);
      render();
      return;
    }
    if (t.classList.contains('remove') && idx !== null){
      items.splice(idx,1);
      save(items);
      render();
      return;
    }
  });

  clearAllBtn.addEventListener('click', ()=>{
    if (!confirm('Clear all items?')) return;
    items = [];
    save(items);
    render();
  });

  clearDoneBtn.addEventListener('click', ()=>{
    items = items.filter(i => !i.done);
    save(items);
    render();
  });

  // initial render
  render();
})();
</script>
</body>
</html>
